title: Vilderidash
# email: 
description: >- # this means to ignore newlines until "baseurl:"
  My link tree.
baseurl: ""
url: "https://vilderidash.com"

# Build settings
plugins:
  - jekyll-feed

defaults:
  - scope:
      path: "" # Applies to all files
    values:
      layout: default

